name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two uploads to the same server at once.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Check FTP settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets under Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp reconnects and retries on its own when Hostinger drops a
      # connection, which the previous upload action could not survive.
      # Order matters: new assets go up first, then index.html (which points
      # at them), and only then are old assets removed, so visitors never load
      # a page whose files are missing. Every attempt ends by comparing file
      # sizes on the server with the build, so a cut-off upload is retried
      # instead of being reported as a success.
      - name: Upload to Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          # Empty means the folder the FTP account opens in. Hostinger FTP accounts
          # can be limited to one folder (e.g. public_html/draw), and then the
          # site goes straight there.
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          dir="${FTP_SERVER_DIR%/}"
          dir="${dir:-.}"
          if [ "$dir" = "." ]; then
            echo "Uploading into the folder the FTP account opens in."
          else
            echo "Uploading into the subfolder '$dir' (set by the FTP_SERVER_DIR variable)."
          fi
          # Encrypted by default; set the FTP_PROTOCOL variable to "ftp" to turn it off.
          if [ "$FTP_PROTOCOL" = "ftp" ]; then tls=false; else tls=true; fi

          # TLS 1.3 can cut uploads short when the data connection closes, so use 1.2.
          cat > settings.lftp <<SCRIPT
          set ftp:ssl-allow $tls
          set ftp:ssl-force $tls
          set ftp:ssl-protect-data $tls
          set ssl:verify-certificate no
          set ssl:priority "NORMAL:-VERS-TLS1.3"
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set cmd:fail-exit true
          SCRIPT

          cat > upload.lftp <<SCRIPT
          source settings.lftp
          mkdir -p -f $dir/assets
          mirror --reverse --ignore-time --parallel=3 --verbose=1 dist/assets $dir/assets
          mirror --reverse --ignore-time --verbose=1 --exclude ^assets/ --exclude ^index\.html\$ dist $dir
          put dist/index.html -o $dir/index.html
          mirror --reverse --ignore-time --delete --verbose=1 dist/assets $dir/assets
          bye
          SCRIPT

          cat > list.lftp <<SCRIPT
          source settings.lftp
          cls -1 $dir
          bye
          SCRIPT

          cat > verify.lftp <<SCRIPT
          source settings.lftp
          mirror --reverse --ignore-time --dry-run dist $dir
          bye
          SCRIPT

          connect() {
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $1" "$FTP_SERVER"
          }

          # Lists files whose size on the server doesn't match the build. The raw
          # dry-run output contains the login, so only file names are printed.
          verify() {
            connect verify.lftp > verify.out 2>&1 || { echo "Could not check the uploaded files."; rm -f verify.out; return 1; }
            mismatched=$(grep '^get ' verify.out | sed 's|.*file:[^ ]*/dist/||')
            rm -f verify.out
            if [ -n "$mismatched" ]; then
              echo "Files that did not upload completely:"
              echo "$mismatched"
              return 1
            fi
          }

          for attempt in 1 2 3; do
            echo "Upload attempt $attempt"
            if connect upload.lftp && verify; then
              echo "Deployed, and every file on the server matches the build."
              echo "The upload folder now contains:"
              connect list.lftp || true
              rm -f settings.lftp upload.lftp verify.lftp list.lftp
              exit 0
            fi
            sleep 20
          done
          rm -f settings.lftp upload.lftp verify.lftp list.lftp
          echo "::error::Upload to Hostinger failed after 3 attempts. See the output above."
          exit 1
